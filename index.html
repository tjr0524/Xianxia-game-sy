<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>수선 비경 프로토타입</title><style>
:root{color-scheme:dark;--bg:#101216;--panel:#171a20;--card:#1d2129;--text:#f2f4f7;--muted:#aab1bd;--border:#303642;--accent:#254873}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}main{max-width:980px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.small{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}.gamewrap{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel)}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}.overlay.hidden{display:none}.dialog,.panel,.stat{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px}.dialog{text-align:center;max-width:360px}button{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--text);min-height:46px;border-radius:11px;padding:10px 14px;font-size:16px;font-weight:650}button.primary{background:var(--accent)}button:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{text-align:center;font-size:13px}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.panel button{width:100%;text-align:left;margin-top:8px}.row{display:flex;justify-content:space-between;gap:8px}#notice{min-height:24px;margin-top:8px}.legend{line-height:1.65}@media(max-width:720px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}}@media(max-width:480px){.side{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:7px 4px;font-size:12px}}
</style></head><body><main id="root"><div class="grid"><section><div class="top"><div><strong id="phaseLabel">동부</strong><div id="subLabel" class="small">수련을 마치고 비경에 진입하세요.</div></div><div class="small" style="text-align:right">영석 <strong id="bankStone">0</strong><br>영초 <strong id="bankHerb">0</strong></div></div><div class="gamewrap"><canvas id="game" width="700" height="460"></canvas><div id="overlay" class="overlay"><div class="dialog"><div style="font-size:20px;font-weight:700;margin-bottom:5px">청운산 후산</div><div class="small" style="margin-bottom:12px">원하는 곳을 한 번 탭하면 그곳까지 이동합니다.<br>적이나 자원을 직접 탭하면 추적합니다.</div><button id="startBtn" class="primary">비경 진입</button></div></div></div><div class="stats"><div class="stat"><span class="small">체력</span><br><strong id="hpText">100 / 100</strong></div><div class="stat"><span class="small">이번 원정</span><br><strong id="runLoot">영석 0 · 영초 0</strong></div><div class="stat"><span class="small">비경 안정도</span><br><strong id="timeText">25.0초</strong></div></div><div class="actions"><button id="skillBtn" disabled>⚔ 어검술</button><button id="returnBtn" class="primary" disabled>↩ 즉시 귀환</button></div><div id="notice" class="small">탭으로 목적지를 지정하세요.</div></section><aside class="side"><section class="panel"><strong>수련</strong><button id="upAtk"><div class="row"><strong>검결</strong><span id="atkLv">Lv.1</span></div><div class="small">공격력 상승 · <span id="atkCost">20</span> 영석</div></button><button id="upMove"><div class="row"><strong>경신법</strong><span id="moveLv">Lv.1</span></div><div class="small">이동속도 상승 · <span id="moveCost">15</span> 영석</div></button><button id="upSense"><div class="row"><strong>신식</strong><span id="senseLv">Lv.1</span></div><div class="small">획득 범위 상승 · <span id="senseCost">3</span> 영초</div></button><button id="upHp"><div class="row"><strong>체수련</strong><span id="hpLv">Lv.1</span></div><div class="small">최대 체력 상승 · <span id="hpCost">25</span> 영석</div></button></section><section class="panel small legend"><strong style="color:var(--text)">개체</strong><br>🔴 적혈랑: 가까이 가면 공격<br>🟠 풍랑: 발견하면 추격<br>🟣 산수: 자원을 주워 탈출<br>🟡 탐보서: 자원을 훔쳐 탈출<br><br>사망/붕괴 시 전리품 40% 회수</section></aside></div></main><script>
(()=>{const r=document.getElementById('root'),c=document.getElementById('game'),g=c.getContext('2d'),$=s=>r.querySelector(s),u={o:$('#overlay'),start:$('#startBtn'),skill:$('#skillBtn'),ret:$('#returnBtn'),phase:$('#phaseLabel'),sub:$('#subLabel'),hp:$('#hpText'),loot:$('#runLoot'),time:$('#timeText'),notice:$('#notice'),bs:$('#bankStone'),bh:$('#bankHerb'),al:$('#atkLv'),ml:$('#moveLv'),sl:$('#senseLv'),hl:$('#hpLv'),ac:$('#atkCost'),mc:$('#moveCost'),sc:$('#senseCost'),hc:$('#hpCost'),ua:$('#upAtk'),um:$('#upMove'),us:$('#upSense'),uh:$('#upHp')};
const m={stone:0,herb:0,atk:1,move:1,sense:1,hp:1},P={x:350,y:230,r:11,hp:100,maxHp:100,cd:0,targetX:350,targetY:230,target:null};let phase='home',last=performance.now(),elapsed=0,nextBeast=0,nextDrop=0,nextSpecial=0,skillCd=0,swing=0,run=null,E=[],D=[],F=[];const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function costs(){return{atk:Math.floor(20*1.6**(m.atk-1)),move:Math.floor(15*1.55**(m.move-1)),sense:Math.floor(3*1.5**(m.sense-1)),hp:Math.floor(25*1.6**(m.hp-1))}}function refresh(){let q=costs();u.bs.textContent=m.stone;u.bh.textContent=m.herb;u.al.textContent='Lv.'+m.atk;u.ml.textContent='Lv.'+m.move;u.sl.textContent='Lv.'+m.sense;u.hl.textContent='Lv.'+m.hp;u.ac.textContent=q.atk;u.mc.textContent=q.move;u.sc.textContent=q.sense;u.hc.textContent=q.hp}
function edgeSpawn(){let k=Math.floor(Math.random()*4),a=24,x,y;if(k===0){x=a;y=Math.random()*c.height}else if(k===1){x=c.width-a;y=Math.random()*c.height}else if(k===2){x=Math.random()*c.width;y=a}else{x=Math.random()*c.width;y=c.height-a}return{x,y}}
function addEnemy(type){let p=edgeSpawn(),multy=elapsed>15?1.45:1,e={id:Math.random(),type,x:p.x,y:p.y,homeX:p.x,homeY:p.y,cd:0,heldStone:0,heldHerb:0,escaping:false,target:null};if(type==='guard')Object.assign(e,{r:13,hp:30*multy,max:30*multy,speed:42,aggro:115,leash:175,damage:9});if(type==='chaser')Object.assign(e,{r:11,hp:21*multy,max:21*multy,speed:61,aggro:195,damage:7});if(type==='rogue')Object.assign(e,{r:12,hp:34*multy,max:34*multy,speed:63,damage:8});if(type==='rat')Object.assign(e,{r:8,hp:14*multy,max:14*multy,speed:82,damage:0});E.push(e)}
function addDrop(type,x=null,y=null,amount=1){D.push({id:Math.random(),type,x:x??30+Math.random()*(c.width-60),y:y??30+Math.random()*(c.height-60),r:type==='stone'?7:8,amount})}function nearestDrop(e){let best=null,bd=1e9;for(const d of D){let q=dist(e,d);if(q<bd){bd=q;best=d}}return best}function nearestEdge(e){let opts=[{x:-20,y:e.y},{x:c.width+20,y:e.y},{x:e.x,y:-20},{x:e.x,y:c.height+20}];return opts.sort((a,b)=>dist(e,a)-dist(e,b))[0]}
function begin(){phase='run';elapsed=0;nextBeast=1;nextDrop=.5;nextSpecial=4;skillCd=0;E=[];D=[];F=[];run={stone:0,herb:0};P.x=350;P.y=230;P.targetX=350;P.targetY=230;P.target=null;P.maxHp=100+(m.hp-1)*30;P.hp=P.maxHp;P.cd=0;u.o.classList.add('hidden');u.skill.disabled=false;u.ret.disabled=false;u.phase.textContent='청운산 후산 · 비경 원정';u.sub.textContent='탭으로 이동하며 남들보다 먼저 챙기세요.';u.notice.textContent='산수와 탐보서도 자원을 노립니다.';for(let i=0;i<8;i++)addDrop(Math.random()<.7?'stone':'herb');addEnemy('guard');addEnemy('guard');addEnemy('chaser');addEnemy('rogue');addEnemy('rat')}
function end(reason){if(phase!=='run')return;phase='home';let ratio=reason==='return'?1:.4,s=Math.floor(run.stone*ratio),h=Math.floor(run.herb*ratio);m.stone+=s;m.herb+=h;u.skill.disabled=true;u.ret.disabled=true;u.o.classList.remove('hidden');u.start.textContent='다시 비경 진입';u.phase.textContent='동부';u.sub.textContent=reason==='return'?`무사 귀환 · 영석 ${s}, 영초 ${h} 확보`:`중상 귀환 · 전리품 40%만 회수`;u.notice.textContent=reason==='dead'?'요수에게 패배했습니다.':reason==='collapse'?'비경 붕괴에 휘말렸습니다.':'안전하게 귀환했습니다.';refresh()}
function moveToward(o,t,sp,dt){let dx=t.x-o.x,dy=t.y-o.y,d=Math.hypot(dx,dy)||1;if(d<2)return;o.x+=dx/d*sp*dt;o.y+=dy/d*sp*dt}
function pickByNPC(e){for(let i=D.length-1;i>=0;i--){let d=D[i];if(dist(e,d)<e.r+d.r+5){if(d.type==='stone')e.heldStone+=d.amount;else e.heldHerb+=d.amount;D.splice(i,1);F.push({x:e.x,y:e.y,t:.5,label:e.type==='rat'?'훔침!':'획득'});if((e.type==='rat'&&e.heldStone+e.heldHerb>=4)||(e.type==='rogue'&&e.heldStone+e.heldHerb>=6))e.escaping=true}}}
function dropHeld(e){for(let i=0;i<e.heldStone;i++)addDrop('stone',e.x+(Math.random()-.5)*20,e.y+(Math.random()-.5)*20);for(let i=0;i<e.heldHerb;i++)addDrop('herb',e.x+(Math.random()-.5)*20,e.y+(Math.random()-.5)*20)}
function updateNPC(e,dt){e.cd=Math.max(0,e.cd-dt);if(e.type==='guard'){let dp=dist(e,P),dh=Math.hypot(e.x-e.homeX,e.y-e.homeY);if(dp<e.aggro&&dh<e.leash)moveToward(e,P,e.speed,dt);else if(dh>10)moveToward(e,{x:e.homeX,y:e.homeY},e.speed*.7,dt)}else if(e.type==='chaser'){if(dist(e,P)<e.aggro||elapsed>15)moveToward(e,P,e.speed,dt)}else{if(e.escaping){moveToward(e,nearestEdge(e),e.speed*(e.type==='rat'?1.15:1),dt)}else{let d=nearestDrop(e);if(d)moveToward(e,d,e.speed,dt);else moveToward(e,{x:c.width/2,y:c.height/2},e.speed*.5,dt);pickByNPC(e)}}if(e.type!=='rat'&&dist(e,P)<P.r+e.r+3&&e.cd<=0){P.hp-=e.damage;e.cd=.7;F.push({x:P.x,y:P.y,t:.35,label:'-'+e.damage})}}
function update(dt){if(phase!=='run')return;elapsed+=dt;let rem=Math.max(0,25-elapsed);if(rem<=0){end('collapse');return}skillCd=Math.max(0,skillCd-dt);swing=Math.max(0,swing-dt);P.cd=Math.max(0,P.cd-dt);if(P.target&&!E.includes(P.target)&&!D.includes(P.target))P.target=null;if(P.target){P.targetX=P.target.x;P.targetY=P.target.y}let dGoal=Math.hypot(P.targetX-P.x,P.targetY-P.y);if(dGoal>5)moveToward(P,{x:P.targetX,y:P.targetY},115+(m.move-1)*22,dt);P.x=clamp(P.x,P.r,c.width-P.r);P.y=clamp(P.y,P.r,c.height-P.r);
nextBeast-=dt;nextDrop-=dt;nextSpecial-=dt;if(nextBeast<=0){addEnemy(Math.random()<.55?'guard':'chaser');nextBeast=elapsed>15?1.4:2.4}if(nextDrop<=0){addDrop(Math.random()<.7?'stone':'herb');nextDrop=.9}if(nextSpecial<=0){addEnemy(Math.random()<.55?'rogue':'rat');nextSpecial=5+Math.random()*3}
let pickup=22+(m.sense-1)*10;for(let i=D.length-1;i>=0;i--){let d=D[i];if(dist(P,d)<pickup+d.r){if(d.type==='stone')run.stone+=d.amount;else run.herb+=d.amount;F.push({x:d.x,y:d.y,t:.5,label:d.type==='stone'?'+영석':'+영초'});if(P.target===d)P.target=null;D.splice(i,1)}}
E.forEach(e=>updateNPC(e,dt));let preferred=P.target&&E.includes(P.target)?P.target:null,near=preferred,nd=preferred?dist(P,preferred):1e9;if(!preferred)for(const e of E){let q=dist(P,e);if(q<nd){nd=q;near=e}}if(near&&nd<94&&P.cd<=0){near.hp-=12+(m.atk-1)*5;P.cd=Math.max(.18,.52-(m.atk-1)*.025);swing=.12}
E=E.filter(e=>{let escaped=e.x<-15||e.x>c.width+15||e.y<-15||e.y>c.height+15;if(escaped&&(e.type==='rogue'||e.type==='rat')){F.push({x:clamp(e.x,20,c.width-60),y:clamp(e.y,20,c.height-20),t:.8,label:`탈출 ${e.heldStone+e.heldHerb}`});return false}if(e.hp<=0){if(P.target===e)P.target=null;dropHeld(e);if(e.type==='guard'||e.type==='chaser')run.stone+=elapsed>15?5:3;else run.stone+=2;return false}return true});F.forEach(f=>f.t-=dt);F=F.filter(f=>f.t>0);if(P.hp<=0){P.hp=0;end('dead');return}u.hp.textContent=`${Math.ceil(P.hp)} / ${P.maxHp}`;u.loot.textContent=`영석 ${run.stone} · 영초 ${run.herb}`;u.time.textContent=`${rem.toFixed(1)}초`;u.skill.textContent=skillCd>0?`⚔ 어검술 ${skillCd.toFixed(1)}`:'⚔ 어검술'}
function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function draw(){g.fillStyle='#171a20';g.fillRect(0,0,c.width,c.height);g.strokeStyle='rgba(127,127,127,.13)';g.lineWidth=1;for(let X=0;X<c.width;X+=35){g.beginPath();g.moveTo(X,0);g.lineTo(X,c.height);g.stroke()}for(let Y=0;Y<c.height;Y+=35){g.beginPath();g.moveTo(0,Y);g.lineTo(c.width,Y);g.stroke()}if(phase==='run'&&elapsed>15){g.fillStyle='rgba(180,80,60,.08)';g.fillRect(0,0,c.width,c.height);g.fillStyle='#da8264';g.font='bold 14px sans-serif';g.fillText('비경 불안정 · 보상 증가',14,24)}D.forEach(d=>{if(d.type==='stone'){g.save();g.translate(d.x,d.y);g.rotate(Math.PI/4);g.fillStyle='#eee';g.fillRect(-6,-6,12,12);g.restore()}else circle(d.x,d.y,d.r,'#46b469')});
E.forEach(e=>{if(e.type==='guard')circle(e.x,e.y,e.r,'#b84242');if(e.type==='chaser')circle(e.x,e.y,e.r,'#dc7a32');if(e.type==='rogue'){g.fillStyle='#9a63d5';g.beginPath();g.moveTo(e.x,e.y-e.r-2);g.lineTo(e.x-e.r,e.y+e.r);g.lineTo(e.x+e.r,e.y+e.r);g.closePath();g.fill()}if(e.type==='rat')circle(e.x,e.y,e.r,'#dec34d');g.fillStyle='rgba(0,0,0,.35)';g.fillRect(e.x-13,e.y-e.r-11,26,4);g.fillStyle='#eee';g.fillRect(e.x-13,e.y-e.r-11,26*Math.max(0,e.hp/e.max),4);if((e.type==='rogue'||e.type==='rat')&&(e.heldStone+e.heldHerb)>0){g.fillStyle='#fff';g.font='11px sans-serif';g.textAlign='center';g.fillText('◆'+e.heldStone+' 🌿'+e.heldHerb,e.x,e.y+e.r+17);g.textAlign='left'}if(e.escaping){g.fillStyle='#ffd37a';g.font='bold 11px sans-serif';g.textAlign='center';g.fillText('도주!',e.x,e.y-e.r-17);g.textAlign='left'}});
g.strokeStyle='rgba(100,175,255,.35)';g.beginPath();g.arc(P.targetX,P.targetY,9,0,Math.PI*2);g.stroke();g.beginPath();g.moveTo(P.targetX-5,P.targetY);g.lineTo(P.targetX+5,P.targetY);g.moveTo(P.targetX,P.targetY-5);g.lineTo(P.targetX,P.targetY+5);g.stroke();g.strokeStyle='rgba(120,170,220,.25)';g.beginPath();g.arc(P.x,P.y,22+(m.sense-1)*10,0,Math.PI*2);g.stroke();circle(P.x,P.y,P.r,'#5a91dc');if(swing>0){g.strokeStyle='#eee';g.lineWidth=2;g.beginPath();g.arc(P.x,P.y,24,-.8,.8);g.stroke()}F.forEach(f=>{g.globalAlpha=Math.min(1,f.t*2);g.fillStyle='#fff';g.font='12px sans-serif';g.fillText(f.label,f.x-18,f.y-18);g.globalAlpha=1})}
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}function point(e){let b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*c.width/b.width,y:(e.clientY-b.top)*c.height/b.height}}c.addEventListener('pointerdown',e=>{if(phase!=='run')return;e.preventDefault();let q=point(e),chosen=null,bd=24;for(const z of [...E,...D]){let d=dist(q,z);if(d<bd){bd=d;chosen=z}}P.target=chosen;P.targetX=chosen?chosen.x:q.x;P.targetY=chosen?chosen.y:q.y;u.notice.textContent=chosen?(E.includes(chosen)?(chosen.type==='rogue'?'산수를 추적합니다.':chosen.type==='rat'?'탐보서를 추적합니다.':'요수를 추적합니다.'):'자원으로 이동합니다.'):'목적지를 변경했습니다.'},{passive:false});u.start.addEventListener('click',begin);u.ret.addEventListener('click',()=>end('return'));u.skill.addEventListener('click',()=>{if(phase!=='run'||skillCd>0)return;skillCd=5;let hits=0;E.forEach(e=>{if(dist(P,e)<125){e.hp-=34+(m.atk-1)*7;hits++}});u.notice.textContent=hits?`${hits}개체에게 검기를 적중시켰습니다.`:'주변에 적이 없습니다.'});function buy(k){if(phase==='run'){u.notice.textContent='수련은 귀환 후 가능합니다.';return}let q=costs();if(k==='sense'){if(m.herb<q.sense){u.notice.textContent='영초가 부족합니다.';return}m.herb-=q.sense;m.sense++}else{if(m.stone<q[k]){u.notice.textContent='영석이 부족합니다.';return}m.stone-=q[k];m[k]++}u.notice.textContent='수련에 성공했습니다.';refresh()}u.ua.addEventListener('click',()=>buy('atk'));u.um.addEventListener('click',()=>buy('move'));u.us.addEventListener('click',()=>buy('sense'));u.uh.addEventListener('click',()=>buy('hp'));refresh();draw();requestAnimationFrame(loop)})();
</script></body></html>
