<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>수선 비경 프로토타입</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#171a20;--card:#1d2129;--text:#f2f4f7;--muted:#aab1bd;--border:#303642;--accent:#254873}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}main{max-width:980px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.small{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}.gamewrap{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel)}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}.overlay.hidden{display:none}.dialog,.panel,.stat{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px}.dialog{text-align:center;max-width:340px}button{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--text);min-height:46px;border-radius:11px;padding:10px 14px;font-size:16px;font-weight:650}button.primary{background:var(--accent)}button:disabled{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.stat{text-align:center;font-size:13px}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}.panel button{width:100%;text-align:left;margin-top:8px}.row{display:flex;justify-content:space-between;gap:8px}#notice{min-height:24px;margin-top:8px}@media(max-width:720px){.grid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}}@media(max-width:480px){.stats,.side{grid-template-columns:1fr}}
</style>
</head>
<body>
<main id="root"><div class="grid"><section><div class="top"><div><strong id="phaseLabel">동부</strong><div id="subLabel" class="small">수련을 마치고 비경에 진입하세요.</div></div><div class="small" style="text-align:right">영석 <strong id="bankStone">0</strong><br>영초 <strong id="bankHerb">0</strong></div></div><div class="gamewrap"><canvas id="game" width="700" height="460"></canvas><div id="overlay" class="overlay"><div class="dialog"><div style="font-size:20px;font-weight:700;margin-bottom:5px">청운산 후산</div><div class="small" style="margin-bottom:12px">화면을 누른 채 움직이세요. 가까운 적은 자동 공격합니다.</div><button id="startBtn" class="primary">비경 진입</button></div></div></div><div class="stats"><div class="stat"><span class="small">체력</span><br><strong id="hpText">100 / 100</strong></div><div class="stat"><span class="small">이번 원정</span><br><strong id="runLoot">영석 0 · 영초 0</strong></div><div class="stat"><span class="small">비경 안정도</span><br><strong id="timeText">25.0초</strong></div></div><div class="actions"><button id="skillBtn" disabled>⚔ 어검술</button><button id="returnBtn" class="primary" disabled>↩ 즉시 귀환</button></div><div id="notice" class="small">초록 원은 영초, 흰 마름모는 영석, 붉은 원은 요수입니다.</div></section><aside class="side"><section class="panel"><strong>수련</strong><button id="upAtk"><div class="row"><strong>검결</strong><span id="atkLv">Lv.1</span></div><div class="small">공격력 상승 · <span id="atkCost">20</span> 영석</div></button><button id="upMove"><div class="row"><strong>경신법</strong><span id="moveLv">Lv.1</span></div><div class="small">이동속도 상승 · <span id="moveCost">15</span> 영석</div></button><button id="upSense"><div class="row"><strong>신식</strong><span id="senseLv">Lv.1</span></div><div class="small">획득 범위 상승 · <span id="senseCost">3</span> 영초</div></button><button id="upHp"><div class="row"><strong>체수련</strong><span id="hpLv">Lv.1</span></div><div class="small">최대 체력 상승 · <span id="hpCost">25</span> 영석</div></button></section><section class="panel small"><strong style="color:var(--text)">규칙</strong><br><br>• 직접 귀환: 전리품 100% 확보<br>• 사망/붕괴: 전리품 40% 확보<br>• 15초 이후 적 강화 + 보상 증가<br>• 어검술: 주변 적 광역 피해</section></aside></div></main>
<script>
(()=>{const r=document.getElementById('root'),c=document.getElementById('game'),x=c.getContext('2d'),$=s=>r.querySelector(s),u={o:$('#overlay'),start:$('#startBtn'),skill:$('#skillBtn'),ret:$('#returnBtn'),phase:$('#phaseLabel'),sub:$('#subLabel'),hp:$('#hpText'),loot:$('#runLoot'),time:$('#timeText'),notice:$('#notice'),bs:$('#bankStone'),bh:$('#bankHerb'),al:$('#atkLv'),ml:$('#moveLv'),sl:$('#senseLv'),hl:$('#hpLv'),ac:$('#atkCost'),mc:$('#moveCost'),sc:$('#senseCost'),hc:$('#hpCost'),ua:$('#upAtk'),um:$('#upMove'),us:$('#upSense'),uh:$('#upHp')};const m={stone:0,herb:0,atk:1,move:1,sense:1,hp:1};let phase='home',last=performance.now(),elapsed=0,nextEnemy=0,nextDrop=0,skillCd=0,swing=0,p={active:false,x:350,y:230},run=null,E=[],D=[],F=[];const P={x:350,y:230,r:11,hp:100,maxHp:100,cd:0};const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cost=()=>({atk:Math.floor(20*1.6**(m.atk-1)),move:Math.floor(15*1.55**(m.move-1)),sense:Math.floor(3*1.5**(m.sense-1)),hp:Math.floor(25*1.6**(m.hp-1))});function refresh(){let q=cost();u.bs.textContent=m.stone;u.bh.textContent=m.herb;u.al.textContent='Lv.'+m.atk;u.ml.textContent='Lv.'+m.move;u.sl.textContent='Lv.'+m.sense;u.hl.textContent='Lv.'+m.hp;u.ac.textContent=q.atk;u.mc.textContent=q.move;u.sc.textContent=q.sense;u.hc.textContent=q.hp}function enemy(){let e=Math.floor(Math.random()*4),a=26,X,Y;if(e===0){X=a;Y=Math.random()*c.height}if(e===1){X=c.width-a;Y=Math.random()*c.height}if(e===2){X=Math.random()*c.width;Y=a}if(e===3){X=Math.random()*c.width;Y=c.height-a}let k=elapsed>15?1.7:1;E.push({x:X,y:Y,r:12,hp:22*k,max:22*k,speed:34+Math.random()*14,cd:0})}function drop(){let t=Math.random()<.72?'stone':'herb';D.push({type:t,x:30+Math.random()*(c.width-60),y:30+Math.random()*(c.height-60),r:t==='stone'?7:8})}function begin(){phase='run';elapsed=0;nextEnemy=0;nextDrop=0;skillCd=0;E=[];D=[];F=[];run={stone:0,herb:0};P.x=350;P.y=230;P.maxHp=100+(m.hp-1)*30;P.hp=P.maxHp;P.cd=0;u.o.classList.add('hidden');u.skill.disabled=false;u.ret.disabled=false;u.phase.textContent='청운산 후산 · 비경 원정';u.sub.textContent='욕심낼수록 보상도 위험도 커집니다.';for(let i=0;i<5;i++)drop();for(let i=0;i<3;i++)enemy()}function end(reason){if(phase!=='run')return;phase='home';p.active=false;let ratio=reason==='return'?1:.4,s=Math.floor(run.stone*ratio),h=Math.floor(run.herb*ratio);m.stone+=s;m.herb+=h;u.skill.disabled=true;u.ret.disabled=true;u.o.classList.remove('hidden');u.start.textContent='다시 비경 진입';u.phase.textContent='동부';u.sub.textContent=reason==='return'?`무사 귀환 · 영석 ${s}, 영초 ${h} 확보`:`중상 귀환 · 전리품 40%만 회수`;u.notice.textContent=reason==='dead'?'요수에게 패배했습니다.':reason==='collapse'?'비경 붕괴에 휘말렸습니다.':'안전하게 귀환했습니다.';refresh()}function update(dt){if(phase!=='run')return;elapsed+=dt;let rem=Math.max(0,25-elapsed);if(rem<=0){end('collapse');return}skillCd=Math.max(0,skillCd-dt);swing=Math.max(0,swing-dt);P.cd=Math.max(0,P.cd-dt);if(p.active){let dx=p.x-P.x,dy=p.y-P.y,d=Math.hypot(dx,dy);if(d>4){let sp=115+(m.move-1)*22;P.x+=dx/d*sp*dt;P.y+=dy/d*sp*dt;P.x=Math.max(P.r,Math.min(c.width-P.r,P.x));P.y=Math.max(P.r,Math.min(c.height-P.r,P.y))}}nextEnemy-=dt;nextDrop-=dt;if(nextEnemy<=0){enemy();nextEnemy=elapsed>15?.75:1.2}if(nextDrop<=0){drop();nextDrop=1.15}let pickup=22+(m.sense-1)*10;D=D.filter(d=>{if(dist(P,d)<pickup+d.r){if(d.type==='stone')run.stone+=elapsed>15?3:2;else run.herb++;F.push({x:d.x,y:d.y,t:.5,label:d.type==='stone'?'+영석':'+영초'});return false}return true});let near=null,nd=1e9;E.forEach(e=>{let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.cd=Math.max(0,e.cd-dt);if(d<P.r+e.r+2&&e.cd<=0){P.hp-=elapsed>15?12:8;e.cd=.65}if(d<nd){nd=d;near=e}});if(near&&nd<92&&P.cd<=0){near.hp-=12+(m.atk-1)*5;P.cd=Math.max(.18,.52-(m.atk-1)*.025);swing=.12}E=E.filter(e=>{if(e.hp<=0){run.stone+=elapsed>15?5:3;if(Math.random()<.18)D.push({type:'herb',x:e.x,y:e.y,r:8});return false}return true});F.forEach(f=>f.t-=dt);F=F.filter(f=>f.t>0);if(P.hp<=0){P.hp=0;end('dead');return}u.hp.textContent=`${Math.ceil(P.hp)} / ${P.maxHp}`;u.loot.textContent=`영석 ${run.stone} · 영초 ${run.herb}`;u.time.textContent=`${rem.toFixed(1)}초`;u.skill.textContent=skillCd>0?`⚔ 어검술 ${skillCd.toFixed(1)}`:'⚔ 어검술'}function draw(){x.fillStyle='#171a20';x.fillRect(0,0,c.width,c.height);x.strokeStyle='rgba(127,127,127,.16)';for(let X=0;X<c.width;X+=35){x.beginPath();x.moveTo(X,0);x.lineTo(X,c.height);x.stroke()}for(let Y=0;Y<c.height;Y+=35){x.beginPath();x.moveTo(0,Y);x.lineTo(c.width,Y);x.stroke()}if(phase==='run'&&elapsed>15){x.fillStyle='rgba(180,80,60,.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#da8264';x.font='bold 14px sans-serif';x.fillText('비경 불안정 · 보상 증가',14,24)}D.forEach(d=>{if(d.type==='stone'){x.save();x.translate(d.x,d.y);x.rotate(Math.PI/4);x.fillStyle='#eee';x.fillRect(-6,-6,12,12);x.restore()}else{x.fillStyle='#46b469';x.beginPath();x.arc(d.x,d.y,d.r,0,Math.PI*2);x.fill()}});E.forEach(e=>{x.fillStyle='#be4646';x.beginPath();x.arc(e.x,e.y,e.r,0,Math.PI*2);x.fill();x.fillStyle='#eee';x.fillRect(e.x-13,e.y-19,26*(e.hp/e.max),4)});x.strokeStyle='rgba(120,170,220,.25)';x.beginPath();x.arc(P.x,P.y,22+(m.sense-1)*10,0,Math.PI*2);x.stroke();x.fillStyle='#5a91dc';x.beginPath();x.arc(P.x,P.y,P.r,0,Math.PI*2);x.fill();if(swing>0){x.strokeStyle='#eee';x.beginPath();x.arc(P.x,P.y,24,-.8,.8);x.stroke()}F.forEach(f=>{x.globalAlpha=Math.min(1,f.t*2);x.fillStyle='#fff';x.fillText(f.label,f.x-18,f.y-18);x.globalAlpha=1})}function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}function point(e){let b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*c.width/b.width,y:(e.clientY-b.top)*c.height/b.height}}c.addEventListener('pointerdown',e=>{if(phase!=='run')return;e.preventDefault();c.setPointerCapture(e.pointerId);p.active=true;Object.assign(p,point(e))},{passive:false});c.addEventListener('pointermove',e=>{if(p.active){e.preventDefault();Object.assign(p,point(e))}},{passive:false});c.addEventListener('pointerup',()=>p.active=false);c.addEventListener('pointercancel',()=>p.active=false);u.start.addEventListener('click',begin);u.ret.addEventListener('click',()=>end('return'));u.skill.addEventListener('click',()=>{if(phase!=='run'||skillCd>0)return;skillCd=5;let hits=0;E.forEach(e=>{if(dist(P,e)<125){e.hp-=34+(m.atk-1)*7;hits++}});u.notice.textContent=hits?`${hits}마리에게 검기를 적중시켰습니다.`:'주변에 적이 없습니다.'});function buy(k){if(phase==='run')return;let q=cost();if(k==='sense'){if(m.herb<q.sense){u.notice.textContent='영초가 부족합니다.';return}m.herb-=q.sense;m.sense++}else{if(m.stone<q[k]){u.notice.textContent='영석이 부족합니다.';return}m.stone-=q[k];m[k]++}u.notice.textContent='수련에 성공했습니다.';refresh()}u.ua.addEventListener('click',()=>buy('atk'));u.um.addEventListener('click',()=>buy('move'));u.us.addEventListener('click',()=>buy('sense'));u.uh.addEventListener('click',()=>buy('hp'));refresh();draw();requestAnimationFrame(loop)})();
</script></body></html>
