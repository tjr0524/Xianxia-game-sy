name: Publish tutorial preview
# guided-onboarding validators synced; stale-save reset synced

on:
  push:
    branches: [tutorial-guided-onboarding]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tutorial-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 0

      - name: Checkout tutorial preview source
        uses: actions/checkout@v4
        with:
          ref: tutorial-guided-onboarding
          path: previewsrc
          fetch-depth: 1

      - name: Validate tutorial preview runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check previewsrc/game_runtime_v11_45.js
          node --check previewsrc/ink_runtime_world_v11_45.js
          node --check previewsrc/progression_runtime_v11_45.js
          node --check previewsrc/systems21_runtime_v11_45.js
          node --check previewsrc/progression_extras_runtime_v11_45.js
          node --check previewsrc/exploration_runtime_v11_45.js
          node --check previewsrc/runtime_preflight_v11_45_flat.js
          node --check previewsrc/runtime_postflight_v11_45_flat.js
          node --check previewsrc/runtime_frame_hub_v11_47.js
          node --check previewsrc/tree_camera_gesture_v11_44.js
          node --check previewsrc/tree_touch_fix_v11_37_4.js
          node --check previewsrc/tutorial_runtime_v11_49.js
          node --check previewsrc/exploration_world_v11_33_4.js
          node --check previewsrc/ui_runtime_v11_48.js
          node --check previewsrc/ui_polish_v11_38.js
          node --check previewsrc/map_v11_18.js
          node --check previewsrc/visual_v11_25.js
          node --check previewsrc/ui_feedback_v11_40.js
          node --check previewsrc/result_flow_v11_41.js
          node --check previewsrc/combat_cooldown_hud_v11_43.js
          node previewsrc/tools/validate_flat_runtime.js previewsrc
          node previewsrc/tools/validate_frame_ownership.js previewsrc
          node previewsrc/tools/validate_ui_ownership.js previewsrc
          node previewsrc/tools/validate_tutorial.js previewsrc
          node previewsrc/tools/validate_desktop_entry.js previewsrc
          node previewsrc/tools/validate_tree_interaction.js previewsrc
          node previewsrc/tools/validate_cache_versions.js previewsrc

      - name: Build /tutorial-preview channel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stable/tutorial-preview
          mkdir -p stable/tutorial-preview
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'test' \
            --exclude 'tutorial-preview' \
            previewsrc/ stable/tutorial-preview/

          python - <<'PY'
          from pathlib import Path
          import os, json

          root = Path("stable/tutorial-preview")
          index = root / "index.html"
          text = index.read_text(encoding="utf-8")
          version = json.loads((root / "version.json").read_text(encoding="utf-8"))
          build = str(version.get("build") or "").strip()
          if not build:
              raise RuntimeError("tutorial preview build is missing from version.json")

          marker = """
          <style id="tutorial-preview-style">
          #tutorialPreviewBadge{
            position:fixed;z-index:2147483600;
            top:calc(env(safe-area-inset-top) + 6px);right:8px;
            padding:3px 7px;border:1px solid rgba(48,112,92,.42);
            border-radius:999px;background:rgba(220,247,235,.94);
            color:#285f4e;font:700 9px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            letter-spacing:.06em;pointer-events:none;
            box-shadow:0 2px 10px rgba(0,0,0,.12)
          }
          body.v22-combat-mode #tutorialPreviewBadge,
          body.v1133-run #tutorialPreviewBadge,
          body.v1141-result-mode #tutorialPreviewBadge{display:none}
          </style>
          """
          if 'id="tutorial-preview-style"' not in text:
              text = text.replace("</head>", marker + "\n</head>")

          badge = f'<div id="tutorialPreviewBadge">TUTORIAL {build}</div>'
          if 'id="tutorialPreviewBadge"' not in text:
              pos = text.find(">", text.find("<body"))
              text = text[:pos+1] + "\n" + badge + text[pos+1:]

          if "<title>" in text and "[TUTORIAL]" not in text:
              text = text.replace("<title>", "<title>[TUTORIAL] ", 1)

          index.write_text(text, encoding="utf-8")

          (root / "preview-channel.json").write_text(json.dumps({
              "channel": "tutorial-preview",
              "source_branch": "tutorial-guided-onboarding",
              "source_sha": os.environ.get("GITHUB_SHA", ""),
              "build": build,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish tutorial snapshot into main/tutorial-preview
        shell: bash
        run: |
          set -euo pipefail
          cd stable
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorial-preview
          if git diff --cached --quiet; then
            echo "Tutorial preview already up to date."
            exit 0
          fi
          git commit -m "Publish tutorial preview from ${GITHUB_SHA::7}"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying against latest main."
          done
          exit 1
